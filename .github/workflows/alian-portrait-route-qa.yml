name: Alian FC actual portrait route QA
on:
  push:
    branches: [season/2026-27]
    paths:
      - scripts/audit-alian-portrait-routes.mjs
      - .github/workflows/alian-portrait-route-qa.yml
      - config/avatarImagePosition.ts
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alian-fc-actual-portrait-qa
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season/2026-27
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install browser and dependencies
        run: |
          npm ci --silent
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
      - name: Build real preview site
        env:
          VITE_ROUTER_MODE: hash
          VITE_USE_OPTIMIZED_IMAGES: "true"
        run: |
          npm run optimize:images
          npx vite build
      - name: Start site
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/alian-preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4173/d-league/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/alian-preview.log
          exit 1
      - name: Check circle coverage geometry
        run: node --test scripts/portrait-circle-coverage.test.mjs
      - name: Capture real team and all 22 profile avatars
        env:
          TEAM_ID: t_alian_2026
          AUDIT_BASE_URL: http://127.0.0.1:4173/d-league
        run: node scripts/audit-alian-portrait-routes.mjs
      - name: Upload source-versus-circle contact sheets and page diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alian-22-person-portrait-qa
          path: |
            audit/alian-actual-*.jpg
            audit/alian-roster-*.jpg
            audit/alian-actual-route-review.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish QA evidence to season branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/alian-actual-*.jpg audit/alian-roster-*.jpg audit/alian-actual-route-review.json
          if ! git diff --cached --quiet; then
            git commit -m "test(qa): publish Alian FC actual portrait evidence [skip ci]"
            git fetch origin season/2026-27
            git rebase origin/season/2026-27
            git push origin HEAD:season/2026-27
          fi
