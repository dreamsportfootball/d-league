name: Apply Chiayi identity and Holy Knights number

on:
  push:
    branches:
      - season/2026-27
    paths:
      - .github/workflows/apply-chiayi-identity-and-holy-number.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout season branch
        uses: actions/checkout@v4
        with:
          ref: season/2026-27
          fetch-depth: 0

      - name: Apply verified data corrections
        run: |
          node <<'NODE'
          const fs = require('fs');

          const teamsPath = 'data/seasons/2025-26/teams.json';
          const playersPath = 'data/seasons/2026-27/players.json';
          const teams = JSON.parse(fs.readFileSync(teamsPath, 'utf8'));
          const players = JSON.parse(fs.readFileSync(playersPath, 'utf8'));

          const historicalChiayi = teams.find((team) => team.id === 't_chiayi');
          if (!historicalChiayi || historicalChiayi.name !== '嘉義諸羅山FC') {
            throw new Error('Expected historical team t_chiayi / 嘉義諸羅山FC');
          }
          if (historicalChiayi.identityId && historicalChiayi.identityId !== 'chiayi-235-fc') {
            throw new Error(`Unexpected historical Chiayi identityId: ${historicalChiayi.identityId}`);
          }
          historicalChiayi.identityId = 'chiayi-235-fc';

          const target = players.find((player) => player.id === 'holy26-17');
          if (!target || target.name !== '張至虔' || target.teamId !== 't_holy_knights_2026') {
            throw new Error('Expected Holy Knights player holy26-17 / 張至虔');
          }
          if (target.number !== 0) {
            throw new Error(`Expected 張至虔 current number 0, found ${target.number}`);
          }
          const duplicate33 = players.find(
            (player) => player.teamId === 't_holy_knights_2026' && player.id !== target.id && player.number === 33,
          );
          if (duplicate33) {
            throw new Error(`Holy Knights #33 already assigned to ${duplicate33.name}`);
          }
          target.number = 33;

          fs.writeFileSync(teamsPath, `${JSON.stringify(teams, null, 2)}\n`, 'utf8');
          fs.writeFileSync(playersPath, `${JSON.stringify(players, null, 2)}\n`, 'utf8');
          console.log('Linked 嘉義諸羅山FC to chiayi-235-fc and assigned 張至虔 #33.');
          NODE

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/apply-chiayi-identity-and-holy-number.yml
          git config user.name "dreamsportfootball"
          git config user.email "dreamsportfootball@gmail.com"
          git add data/seasons/2025-26/teams.json data/seasons/2026-27/players.json .github/workflows/apply-chiayi-identity-and-holy-number.yml
          git diff --cached --quiet && exit 0
          git commit -m "Link Chiayi club history and assign Zhang Zhichien number 33"
          git push origin HEAD:season/2026-27
