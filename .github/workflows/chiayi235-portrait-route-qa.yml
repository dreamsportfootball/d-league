name: Chiayi 235 targeted portrait route QA
on:
  push:
    branches: [season/2026-27]
    paths:
      - scripts/audit-chiayi235-portrait-routes.mjs
      - .github/workflows/chiayi235-portrait-route-qa.yml
      - scripts/portrait-circle-coverage.mjs
      - config/avatarImagePosition.ts
      - data/seasons/2026-27/playerImages.json
      - 'public/assets/seasons/2026-27/players/c23526-*.png'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chiayi235-actual-portrait-qa
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season/2026-27
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci --silent
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
      - name: Build actual preview site with image optimizer
        env:
          VITE_ROUTER_MODE: hash
          VITE_USE_OPTIMIZED_IMAGES: "true"
        run: |
          npm run optimize:images
          npx vite build
      - name: Start preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/chiayi235-preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4173/d-league/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/chiayi235-preview.log
          exit 1
      - name: Validate shared circular crop geometry
        run: node --test scripts/portrait-circle-coverage.test.mjs
      - name: Validate real team, 17 targeted player pages at 390px and 1280px
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173/d-league
        run: node scripts/audit-chiayi235-portrait-routes.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chiayi235-actual-portrait-qa
          path: |
            audit/chiayi235-actual-*.jpg
            audit/chiayi235-roster-*.jpg
            audit/chiayi235-actual-route-review.json
          if-no-files-found: warn
          retention-days: 14
