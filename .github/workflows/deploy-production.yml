name: Deploy production site

on:
  push:
    branches:
      - master
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-pages
  cancel-in-progress: true

jobs:
  deploy-production:
    # Coordinate writes to gh-pages with the active season preview deployment.
    concurrency:
      group: d-league-gh-pages-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --silent
          npm install --no-save sharp

      - name: Validate source and season data
        run: |
          npm run typecheck
          npm run validate:data

      # Refresh the public cumulative view count from GA4.
      - name: Generate public site metrics
        env:
          GA4_PROPERTY_ID: "543337320"
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: node scripts/fetch-ga4-site-metrics.mjs

      - name: Optimize website images
        run: npm run optimize:images

      - name: Build production site with static SEO
        env:
          VITE_USE_OPTIMIZED_IMAGES: "true"
          VITE_ANALYTICS_DISABLED: "false"
          VITE_GA_MEASUREMENT_ID: "G-XQBVK88M6K"
        run: npm run build:site

      # Never publish a build that fails actual production-router journeys.
      # Run after the production build so the tested bytes match the published bytes.
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve the built production site
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/d-league-production-smoke.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/d-league/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/d-league-production-smoke.log
          exit 1

      - name: Gate production release on browser smoke checks
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173/d-league
        run: node scripts/validate-production-release.mjs

      - name: Upload smoke screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-failures
          path: audit/production-release-*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish production site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true
          force_orphan: false
          commit_message: "deploy: publish production site"

      # Re-publish the current build's assets into this subdirectory only.
      # keep_files: false removes old hashed JS/CSS but does not touch preview/.
      # Run after the full site is published to preserve any existing live pages.
      - name: Prune obsolete production assets without touching previews
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist/assets
          destination_dir: assets
          keep_files: false
          force_orphan: false
          commit_message: "deploy: prune old production asset versions"
