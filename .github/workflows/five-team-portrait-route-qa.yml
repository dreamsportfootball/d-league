name: Five teams real-page avatar QA
on:
  push:
    branches: [season/2026-27]
    paths:
      - scripts/audit-five-team-portrait-routes.mjs
      - .github/workflows/five-team-portrait-route-qa.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: five-team-portraits-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        team_id: [t_niaoshi_2026, t_sf_2026, t_kaohsiung_amateur_2026, t_tongque_2026, t_pingtung_wolves_2026]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season/2026-27
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci --silent
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
      - name: Build
        env:
          VITE_ROUTER_MODE: hash
          VITE_USE_OPTIMIZED_IMAGES: "true"
        run: |
          npm run optimize:images
          npx vite build
      - name: Start local production preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 >/tmp/portrait-preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4173/d-league/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portrait-preview.log
          exit 1
      - name: Inspect real team and personal pages
        env:
          TEAM_ID: ${{ matrix.team_id }}
          AUDIT_BASE_URL: http://127.0.0.1:4173/d-league
        run: node scripts/audit-five-team-portrait-routes.mjs
      - name: Save evidence as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portraits-${{ matrix.team_id }}
          path: |
            audit/five-team-*-actual-*.jpg
            audit/five-team-*-roster-*.jpg
            audit/five-team-*-actual-route-review.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit actual-page QA evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/five-team-*-actual-*.jpg audit/five-team-*-roster-*.jpg audit/five-team-*-actual-route-review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(qa): save ${{ matrix.team_id }} real portrait checks [skip ci]"
          for attempt in {1..8}; do
            git fetch origin season/2026-27
            git rebase origin/season/2026-27
            if git push origin HEAD:season/2026-27; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
