name: Fix Wanderers Wang name

on:
  push:
    branches:
      - season/2026-27
    paths:
      - .github/workflows/fix-wanderers-wang-name.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout season branch
        uses: actions/checkout@v4
        with:
          ref: season/2026-27
          fetch-depth: 0

      - name: Correct player name
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/seasons/2026-27/players.json';
          const players = JSON.parse(fs.readFileSync(path, 'utf8'));
          const player = players.find((item) => item.id === 'wa26-11');
          if (!player) throw new Error('wa26-11 not found');
          if (player.teamId !== 't_wanderers_2026' || player.number !== 11) {
            throw new Error('wa26-11 team or shirt number mismatch');
          }
          if (player.name !== '王亮均') {
            throw new Error(`Expected current name 王亮均, found ${player.name}`);
          }
          if (player.englishName !== 'WANG LIANG CHUN' || player.identityId !== 'wang-liang-chun') {
            throw new Error('Unexpected English name or identityId');
          }
          player.name = '王亮鈞';
          fs.writeFileSync(path, `${JSON.stringify(players, null, 2)}\n`, 'utf8');
          NODE

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/fix-wanderers-wang-name.yml
          git config user.name "dreamsportfootball"
          git config user.email "dreamsportfootball@gmail.com"
          git add data/seasons/2026-27/players.json .github/workflows/fix-wanderers-wang-name.yml
          git diff --cached --quiet && exit 0
          git commit -m "Correct Wanderers Wang Liang-Chun name"
          git push origin HEAD:season/2026-27
