name: Generate Holy Knights source portraits
on:
  push:
    branches: [season/2026-27]
    paths: [scripts/prepare-holy-knights-portraits.mjs]
permissions:
  contents: write
concurrency:
  group: holy-knights-portrait-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season/2026-27
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate six source-preserving portrait variants
        run: |
          npm ci --silent
          npm install --no-save sharp
          node scripts/prepare-holy-knights-portraits.mjs
      - name: Commit only Holy Knights image mapping and derivatives
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/seasons/2026-27/players/holy26-*owner-*.webp data/seasons/2026-27/playerImages.json audit/holy-knights-source-framing-generated.json
          git diff --cached --check
          git commit -m "fix(holy-knights): prepare six original-photo full-head avatars"
          git fetch origin season/2026-27
          git rebase origin/season/2026-27
          git push origin HEAD:season/2026-27
