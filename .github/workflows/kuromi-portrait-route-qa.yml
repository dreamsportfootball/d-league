name: KUROMI actual portrait route QA
on:
  push:
    branches: [season/2026-27]
    paths:
      - scripts/audit-kuromi-portrait-routes.mjs
      - .github/workflows/kuromi-portrait-route-qa.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kuromi-actual-portrait-qa
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season/2026-27
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm ci --silent
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
      - name: Build actual preview site with image optimizer
        env:
          VITE_ROUTER_MODE: hash
          VITE_USE_OPTIMIZED_IMAGES: "true"
        run: |
          npm run optimize:images
          npx vite build
      - name: Start preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/kuromi-preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4173/d-league/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kuromi-preview.log
          exit 1
      - name: Validate real team, 20 player and 3 staff pages at 390px and 1280px
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173/d-league
        run: node scripts/audit-kuromi-portrait-routes.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuromi-actual-portrait-qa
          path: |
            audit/kuromi-actual-*.jpg
            audit/kuromi-roster-*.png
            audit/kuromi-actual-route-review.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit current actual-page evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/kuromi-actual-*.jpg audit/kuromi-roster-*.png audit/kuromi-actual-route-review.json
          if ! git diff --cached --quiet; then
            git commit -m "test(qa): publish KUROMI real-route portrait evidence [skip ci]"
            git fetch origin season/2026-27
            git rebase origin/season/2026-27
            git push origin HEAD:season/2026-27
          fi
