name: Next five-team portrait route QA
on:
  push:
    branches: [season/2026-27]
    paths:
      - scripts/audit-next-five-portrait-routes.mjs
      - .github/workflows/next-five-portrait-route-qa.yml
      - config/avatarImagePosition.ts
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: next-next-five-actual-portrait-qa
  cancel-in-progress: true
jobs:
  team:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { team: t_kaohsiung_hk_2026, prefix: next-kaohsiung-hk }
          - { team: t_pingtung_wild_ape_2026, prefix: next-pingtung-wild-ape }
          - { team: t_chen_2026, prefix: next-chen }
          - { team: t_tainan_evergreen_2026, prefix: next-tainan-evergreen }
          - { team: t_black_wolf_2026, prefix: next-black-wolf }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season/2026-27
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and install browser
        env:
          VITE_ROUTER_MODE: hash
          VITE_USE_OPTIMIZED_IMAGES: "true"
        run: |
          npm ci --silent
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk >/dev/null
          npm run optimize:images
          npx vite build
      - name: Preview local production site
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/next-five-preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:4173/d-league/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/next-five-preview.log
          exit 1
      - name: Verify shared circular cropping geometry gate
        run: node --test scripts/portrait-circle-coverage.test.mjs
      - name: Check real team, player and staff profile pages, image decoding and screenshots
        env:
          TEAM_ID: ${{ matrix.team }}
          AUDIT_BASE_URL: http://127.0.0.1:4173/d-league
        run: node scripts/audit-next-five-portrait-routes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-five-${{ matrix.team }}
          path: |
            audit/${{ matrix.prefix }}-actual-*.jpg
            audit/${{ matrix.prefix }}-roster-*.jpg
            audit/${{ matrix.prefix }}-actual-route-review.json
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [team]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season/2026-27
      - uses: actions/download-artifact@v4
        with:
          pattern: next-five-*
          path: audit
          merge-multiple: true
      - name: Publish review evidence to season branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/next-*-actual-*.jpg audit/next-*-roster-*.jpg audit/next-*-actual-route-review.json
          if ! git diff --cached --quiet; then
            git commit -m "test(qa): publish five-team actual portrait route evidence [skip ci]"
            git fetch origin season/2026-27
            git rebase origin/season/2026-27
            git push origin HEAD:season/2026-27
          fi
