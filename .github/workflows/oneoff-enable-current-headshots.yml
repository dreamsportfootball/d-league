name: One-off current headshot validation

on:
  push:
    branches:
      - season/2026-27
    paths:
      - .github/workflows/oneoff-enable-current-headshots.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season/2026-27
          fetch-depth: 0
      - name: Update validation rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-season-data.mjs')
          text = path.read_text(encoding='utf-8')

          old_import = "import { readFileSync, readdirSync } from 'node:fs';"
          new_import = "import { existsSync, readFileSync, readdirSync } from 'node:fs';"
          if old_import not in text:
              raise SystemExit('fs import guard missing')
          text = text.replace(old_import, new_import, 1)

          old_images = "  for (const [name, path] of Object.entries(images)) asset(path, `${season} player image ${name}`);"
          new_images = """  const playerNames = new Set(players.map((player) => player.name));
  for (const [name, path] of Object.entries(images)) {
    asset(path, `${season} player image ${name}`);
    if (!playerNames.has(name)) fail(`${season} player image ${name}: unknown player`);
    if (season === CURRENT_SEASON_ID) {
      const expectedPrefix = `assets/seasons/${CURRENT_SEASON_ID}/players/`;
      if (!path.startsWith(expectedPrefix)) {
        fail(`${season} player image ${name}: must use a current-season asset`);
      }
      if (!existsSync(join(root, 'public', path))) {
        fail(`${season} player image ${name}: missing asset ${path}`);
      }
    }
  }"""
          if old_images not in text:
              raise SystemExit('image validation guard missing')
          text = text.replace(old_images, new_images, 1)

          old_empty = """for (const file of [
  'playerImages.json',
  'matches.json',"""
          new_empty = """for (const file of [
  'matches.json',"""
          if old_empty not in text:
              raise SystemExit('empty-list guard missing')
          text = text.replace(old_empty, new_empty, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/oneoff-enable-current-headshots.yml').unlink()
          PY
      - name: Commit patched validator
        shell: bash
        run: |
          git config user.name "dreamsportfootball"
          git config user.email "dreamsportfootball@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: validate confirmed current-season headshots"
          git push origin HEAD:season/2026-27
