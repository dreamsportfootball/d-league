name: One-off finalize team player return test

on:
  push:
    branches:
      - season/2026-27
    paths:
      - .github/workflows/oneoff-fix-team-player-return.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season/2026-27
          fetch-depth: 0

      - name: Fix responsive test selectors and remove one-off workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate-scroll-restoration.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "a[href*=\"/teams/\"][href*=\"season=2026-27\"]": "a[href*=\"/teams/\"][href*=\"season=2026-27\"]:visible",
              "a[href*=\"/teams/\"][href*=\"season=2025-26\"]": "a[href*=\"/teams/\"][href*=\"season=2025-26\"]:visible",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing selector: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/oneoff-fix-team-player-return.yml

      - name: Commit final test cleanup
        shell: bash
        run: |
          git config user.name "dreamsportfootball"
          git config user.email "dreamsportfootball@users.noreply.github.com"
          git add scripts/validate-scroll-restoration.mjs
          git diff --cached --check
          git commit -m "test: validate visible team player return links"
          git push origin HEAD:season/2026-27
