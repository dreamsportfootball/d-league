name: One-off player history and kit update

on:
  push:
    branches:
      - season/2026-27
    paths:
      - .github/workflows/oneoff-player-history-kits.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout season branch
        uses: actions/checkout@v4
        with:
          ref: season/2026-27
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply scoped changes
        run: python scripts/oneoff-player-history-kits.py

      - name: Remove one-off files
        run: rm .github/workflows/oneoff-player-history-kits.yml scripts/oneoff-player-history-kits.py

      - name: Install dependencies
        run: npm ci --silent

      - name: TypeScript check
        run: npm run typecheck

      - name: Validate data
        run: npm run validate:data

      - name: Production build check
        run: npm run build:site

      - name: Commit scoped changes
        run: |
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct player history names and team kits"
          git push origin HEAD:season/2026-27
