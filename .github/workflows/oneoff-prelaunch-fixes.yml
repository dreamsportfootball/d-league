name: One-off prelaunch fixes

on:
  push:
    branches:
      - season/2026-27
    paths:
      - .github/workflows/oneoff-prelaunch-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season/2026-27
          fetch-depth: 0
      - name: Apply verified changes
        run: python -c "import base64; exec(base64.b64decode('').decode())"
      - name: Commit patched source
        run: |
          git config user.name "dreamsportfootball"
          git config user.email "dreamsportfootball@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: prepare site for 2026-27 kickoff"
          git push origin HEAD:season/2026-27
