name: One-off update Black Knights roster

on:
  push:
    branches:
      - season/2026-27
    paths:
      - .github/workflows/oneoff-update-black-knights-roster.yml

permissions:
  contents: write

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout season branch
        uses: actions/checkout@v4
        with:
          ref: season/2026-27
          fetch-depth: 0

      - name: Update Kaohsiung Black Knights players
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'data/seasons/2026-27/players.json';
          const teamId = 't_kaohsiung_black_knights_2026';
          const players = JSON.parse(fs.readFileSync(file, 'utf8'));
          const indexes = players
            .map((player, index) => player.teamId === teamId ? index : -1)
            .filter((index) => index >= 0);
          if (indexes.length === 0) throw new Error('Black Knights roster not found');
          const first = Math.min(...indexes);
          const last = Math.max(...indexes);
          const roster = [
            { id: 'kbk26-01', identityId: 'l-joel-vega-v', teamId, name: 'Joel Vega', englishName: 'L. JOEL VEGA V', number: 10, gender: '男', nationality: '尼加拉瓜', age: 37 },
            { id: 'kbk26-02', identityId: 'wang-jia-wei', teamId, name: '王家偉', englishName: 'WANG JIA WEI', number: 17, gender: '男', nationality: '台灣', age: 34 },
            { id: 'kbk26-03', identityId: 'michael-stein-lenihan', teamId, name: 'MICHAEL LENIHAN', englishName: 'MICHAEL STEIN LENIHAN', number: 16, gender: '男', nationality: '愛爾蘭', age: 39 },
            { id: 'kbk26-04', identityId: 'patrick-bryan-haines', teamId, name: 'PATRICK HAINES', englishName: 'PATRICK BRYAN HAINES', number: 36, gender: '男', nationality: '美國', age: 38 },
            { id: 'kbk26-05', identityId: 'charles-nwangi-njoroge', teamId, name: 'CHARLES NWANGI', englishName: 'CHARLES NWANGI NJOROGE', number: 26, gender: '男', nationality: '肯亞', age: 37 },
            { id: 'kbk26-06', identityId: 'hlandze-likhwa-lethu', teamId, name: 'LIKHWA', englishName: 'HLANDZE LIKHWA LETHU', number: 4, gender: '男', nationality: '史瓦帝尼', age: 27 },
            { id: 'kbk26-07', identityId: 'ahmed-nadeem-khaleel-kandouri', teamId, name: 'ALI', englishName: 'AHMED NADEEM KHALEEL KANDOURI', number: 79, gender: '男', nationality: '伊拉克', age: 37 },
            { id: 'kbk26-08', identityId: 'lucas-matias-roa-espinola', teamId, name: 'LUCAS ROA', englishName: 'Lucas Matias Roa Espinola', number: 29, gender: '男', nationality: '巴拉圭', age: 23 },
            { id: 'kbk26-13', identityId: 'douglas-alexander-alfaro', teamId, name: 'DOUGLAS', englishName: 'DOUGLAS ALEXANDER ALFARO', number: 35, gender: '男', nationality: '薩爾瓦多', age: 32 },
            { id: 'kbk26-09', identityId: 'lian-yu-xiang', teamId, name: '連于翔', englishName: 'LIAN YU XIANG', number: 11, gender: '男', nationality: '台灣', age: 16 },
            { id: 'kbk26-10', identityId: 'huang-yen-pu', teamId, name: '黃衍普', englishName: 'HUANG YEN PU', number: 30, gender: '男', nationality: '台灣', age: 16 },
            { id: 'kbk26-11', identityId: 'manongi-dickson', teamId, name: 'DICKSON', englishName: 'MANONGI DICKSON', number: 7, gender: '男', nationality: '索羅門群島', age: 33 },
            { id: 'kbk26-12', identityId: 'chiang-pin', teamId, name: '姜斌', englishName: 'CHIANG PIN', number: 2, gender: '男', nationality: '台灣', age: 21 }
          ];
          const next = [...players.slice(0, first), ...roster, ...players.slice(last + 1)];
          fs.writeFileSync(file, `${JSON.stringify(next, null, 2)}\n`);
          NODE

      - name: Remove one-off workflow and commit roster
        shell: bash
        run: |
          rm .github/workflows/oneoff-update-black-knights-roster.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seasons/2026-27/players.json .github/workflows/oneoff-update-black-knights-roster.yml
          git commit -m "feat: update Kaohsiung Black Knights roster"
          git push origin HEAD:season/2026-27
