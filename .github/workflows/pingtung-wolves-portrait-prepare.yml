name: Generate Pingtung Wolves source portraits
on:
  push:
    branches: [season/2026-27]
    paths: [scripts/prepare-pingtung-wolves-portraits.mjs]
permissions:
  contents: write
concurrency:
  group: pingtung-wolves-portrait-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: season/2026-27
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Produce only the verified five-player portraits
        run: |
          npm ci --silent
          npm install --no-save sharp
          node scripts/prepare-pingtung-wolves-portraits.mjs
      - name: Commit generated assets, mapping and original-photo evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/seasons/2026-27/players/pw26-*owner-*.webp data/seasons/2026-27/playerImages.json audit/pingtung-wolves-source-framing-20261105.json
          git diff --cached --check
          git commit -m "fix(pingtung-wolves): reframe five same-person original photos"
          git fetch origin season/2026-27
          git rebase origin/season/2026-27
          git push origin HEAD:season/2026-27
