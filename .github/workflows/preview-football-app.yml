name: Football app UI preview (isolated)

on:
  push:
    branches:
      - preview/football-app-inspired-20261119

permissions:
  contents: write

concurrency:
  group: football-app-ui-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/preview/football-app-inspired-20261119'
    concurrency:
      group: d-league-gh-pages-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --silent
          npm install --no-save sharp

      - name: Check TypeScript and official competition data
        run: |
          npm run typecheck
          npm run validate:data

      - name: Optimize images
        run: npm run optimize:images

      - name: Build self-contained preview (no analytics)
        env:
          VITE_ROUTER_MODE: hash
          VITE_USE_OPTIMIZED_IMAGES: 'true'
          VITE_ANALYTICS_DISABLED: 'true'
        run: |
          npx vite build --base=/d-league/preview/football-app/
          npm run generate:seo
          npm run enrich:seo
          npm run validate:seo
          node scripts/validate-public-build-security.mjs

      - name: Install Chromium for preview QA
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve the exact preview build
        run: |
          nohup npx vite preview --base=/d-league/preview/football-app/ --host 127.0.0.1 --port 4173 > /tmp/football-app-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/d-league/preview/football-app/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/football-app-preview.log
          exit 1

      - name: Validate eight screen sizes and capture mobile/desktop previews
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173/d-league/preview/football-app
        run: node scripts/validate-football-preview.mjs

      - name: Upload screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-app-ui-preview
          path: |
            dist/football-app-*.png
            audit/football-preview-*-failure.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish independent GitHub Pages preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: preview/football-app
          keep_files: false
          force_orphan: false
          commit_message: "preview: publish isolated football app UI"
