name: Preview five motion enhancements

on:
  push:
    branches:
      - feature/ui-motion-five-20261026

permissions:
  contents: write

concurrency:
  group: preview-motion-five-20261026
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Validate source and season data
        run: |
          npm run typecheck
          npm run validate:data

      - name: Build isolated static preview
        env:
          VITE_ROUTER_MODE: hash
          VITE_USE_OPTIMIZED_IMAGES: 'false'
          VITE_ANALYTICS_DISABLED: 'true'
          VITE_MOTION_DEMO: 'true'
        run: |
          npx vite build --base=/d-league/preview/motion-five-20261026/
          npm run generate:seo
          npm run enrich:seo
          npm run validate:seo

      - name: Publish only the isolated preview subdirectory
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: preview/motion-five-20261026
          keep_files: true
          force_orphan: false
          commit_message: "preview: five UI motion effects"
