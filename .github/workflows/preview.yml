name: Deploy 2026-27 preview

on:
  push:
    branches:
      - season/2026-27
  workflow_dispatch:

# Preview deployment is intentionally isolated from production.
permissions:
  contents: write

concurrency:
  group: season-2026-27-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    # Serialize gh-pages branch updates with production; retain preview push cancellation above.
    concurrency:
      group: d-league-gh-pages-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Show preview source
        run: echo "Preview source ${GITHUB_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --silent
          npm install --no-save sharp

      - name: Validate source and season data
        run: |
          npm run typecheck
          npm run validate:data

      - name: Generate public site metrics
        env:
          GA4_PROPERTY_ID: "543337320"
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: node scripts/fetch-ga4-site-metrics.mjs

      - name: Optimize website images
        run: npm run optimize:images

      - name: Build isolated preview and validate static SEO
        env:
          VITE_ROUTER_MODE: hash
          VITE_USE_OPTIMIZED_IMAGES: 'true'
          VITE_ANALYTICS_DISABLED: 'true'
        run: |
          npx vite build --base=/d-league/preview/season-2026-27/
          npm run generate:seo
          npm run enrich:seo
          npm run validate:seo

      # Deploy only after the same interactive flows users will exercise have passed.
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve the built preview for release checks
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/d-league-release-gate.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/d-league/preview/season-2026-27/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/d-league-release-gate.log
          exit 1

      - name: Gate preview release on real UI checks
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173/d-league/preview/season-2026-27
        run: |
          node scripts/validate-fan-ux.mjs
          node scripts/validate-home-match-dialog-return.mjs
          node scripts/validate-team-roster-ui.mjs

      - name: Publish preview without replacing production
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: preview/season-2026-27
          # Replace only this preview directory to prevent stale hashed JS/CSS accumulation.
          # The production site and other preview directories remain untouched.
          keep_files: false
          force_orphan: false
          commit_message: "preview: deploy 2026-27 season site"
