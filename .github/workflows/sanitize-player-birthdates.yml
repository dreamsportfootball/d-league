name: Sanitize public player birth dates

on:
  push:
    branches:
      - season/2026-27
    paths:
      - .github/workflows/sanitize-player-birthdates.yml

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout season branch
        uses: actions/checkout@v4
        with:
          ref: season/2026-27
          fetch-depth: 0

      - name: Verify ages and remove birth dates
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/seasons/2026-27/players.json';
          const players = JSON.parse(fs.readFileSync(path, 'utf8'));
          const reference = { year: 2026, month: 11, day: 1 };
          const mismatches = [];
          let removed = 0;

          const ageAtReference = (birthDate) => {
            const [year, month, day] = birthDate.split('-').map(Number);
            let age = reference.year - year;
            if (month > reference.month || (month === reference.month && day > reference.day)) {
              age -= 1;
            }
            return age;
          };

          for (const player of players) {
            if (typeof player.birthDate !== 'string') continue;
            const expectedAge = ageAtReference(player.birthDate);
            if (player.age !== expectedAge) {
              mismatches.push(`${player.id}: stored=${player.age}, expected=${expectedAge}`);
              continue;
            }
            delete player.birthDate;
            removed += 1;
          }

          if (mismatches.length > 0) {
            console.error('Age validation failed against 2026-11-01:');
            console.error(mismatches.join('\n'));
            process.exit(1);
          }

          if (removed !== 54) {
            console.error(`Expected 54 birthDate fields, found ${removed}. Refusing partial cleanup.`);
            process.exit(1);
          }

          fs.writeFileSync(path, `${JSON.stringify(players, null, 2)}\n`, 'utf8');
          console.log(`Verified 54 ages against 2026-11-01 and removed 54 birthDate fields.`);
          NODE

      - name: Commit sanitized player data
        run: |
          git config user.name "dreamsportfootball"
          git config user.email "dreamsportfootball@gmail.com"
          git add data/seasons/2026-27/players.json
          git diff --cached --quiet && exit 0
          git commit -m "Remove public player birth dates"
          git push origin HEAD:season/2026-27
