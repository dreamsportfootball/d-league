name: Temporary 11-22 album thumbnail research
on:
  push:
    branches: [season/2026-27]
    paths: [.github/workflows/temp-zonerama-cover-research.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install Pillow
        run: python3 -m pip install --user Pillow --quiet
      - name: Inspect D LEAGUE official albums and public share cover
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,io,re,html,base64
          from PIL import Image,ImageOps
          def get(url):
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/124 Safari/537.36"})
            with urllib.request.urlopen(req,timeout=30) as r:return r.read(),r.headers.get("Content-Type"),r.url
          for url in ["https://eu.zonerama.com/DLEAGUE","https://eu.zonerama.com/DLEAGUE/Albums"]:
            try:
              raw,ct,u=get(url)
              s=raw.decode("utf-8","replace")
              print("PROFILE",url,len(s),u,ct,flush=True)
              ptn=r'.{0,190}(?:/DLEAGUE/Album/|26\.11\.22|2026\.11\.22|26\.11\.15).{0,180}'
              for i,m in enumerate(re.findall(ptn,s,re.I|re.S)):
                if i>45:break
                print("ALBUM_SNIPPET",i,html.unescape(re.sub(r'\s+',' ',m))[:350],flush=True)
            except Exception as e:print("ERROR_PROFILE",str(e)[:200],flush=True)
          for url in ["https://eu.zonerama.com/social/img/album-cover/17357836","https://eu.zonerama.com/social/img/album-cover/17302213"]:
            try:
              raw,ct,u=get(url)
              print("COVER",url,len(raw),u,ct,flush=True)
              im=Image.open(io.BytesIO(raw)).convert("RGB")
              print("COVER_DIMENSIONS",im.size,flush=True)
              im.thumbnail((640,440))
              b=io.BytesIO();im.save(b,format="JPEG",quality=60,optimize=True)
              s64=base64.b64encode(b.getvalue()).decode("ascii")
              print("COVER_IMAGE_BEGIN "+url,flush=True)
              for i in range(0,len(s64),4000):print("SHEET_CHUNK "+s64[i:i+4000],flush=True)
              print("COVER_IMAGE_END",flush=True)
            except Exception as e:print("ERROR_COVER",url,type(e).__name__,str(e)[:200],flush=True)
          PY
