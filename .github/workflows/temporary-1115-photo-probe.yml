name: Temporary investigate Zonerama 11-15 real photos
on:
  push:
    branches: [season/2026-27]
    paths: ['.github/workflows/temporary-1115-photo-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Get Pillow
        run: python3 -m pip install pillow --quiet
      - name: Produce standalone real match-day cover, original 692541262
        run: |
          python3 - <<'PY'
          import urllib.request,io,base64
          from PIL import Image,ImageOps
          url="https://eu.zonerama.com/social/img/photo/692541262"
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/124 Safari/537.36'})
          with urllib.request.urlopen(req,timeout=35) as res:
            raw=res.read()
            assert res.status==200 and res.headers.get("Content-Type","").startswith("image/")
          photo=Image.open(io.BytesIO(raw)).convert("RGB")
          assert photo.width>=1200 and photo.height>=800,(photo.size,len(raw))
          target=ImageOps.fit(photo,(1200,800),method=Image.Resampling.LANCZOS,centering=(0.5,0.57))
          output=io.BytesIO()
          target.save(output,format="JPEG",quality=82,optimize=True,subsampling=0)
          data=output.getvalue()
          assert data.startswith(b'\xff\xd8') and len(data)>25000
          print("PHOTO_SOURCE",url,"ORIGINAL",photo.size,"COVER",target.size,"JPEG_BYTES",len(data),flush=True)
          encoded=base64.b64encode(data).decode('ascii')
          print("PHOTO_B64_BEGIN",len(encoded),flush=True)
          for i in range(0,len(encoded),4000):print("PHOTO_CHUNK "+encoded[i:i+4000],flush=True)
          print("PHOTO_B64_END",flush=True)
          PY
