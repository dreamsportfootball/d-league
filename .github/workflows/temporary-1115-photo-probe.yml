name: Temporary investigate Zonerama 11-15 real photos
on:
  push:
    branches: [season/2026-27]
    paths: ['.github/workflows/temporary-1115-photo-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Get Pillow
        run: python3 -m pip install pillow --quiet
      - name: Compare 16 actual single-photo share previews
        run: |
          python3 - <<'PY'
          import urllib.request,base64,io
          from PIL import Image,ImageDraw,ImageOps
          ids=[692541380,692541377,692541358,692541359,692541362,692541333,692541318,692541273,692541236,692541191,692541152,692541121,692541082,692541052,692541023,692540944]
          W,H=260,210
          pic=Image.new("RGB",(W*4,H*4),(248,248,248))
          pen=ImageDraw.Draw(pic)
          for n,pid in enumerate(ids):
            url=f"https://eu.zonerama.com/social/img/photo/{pid}"
            try:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"})
              with urllib.request.urlopen(req,timeout=25) as r:raw=r.read()
              im=Image.open(io.BytesIO(raw)).convert("RGB")
              print("PHOTO",n,pid,len(raw),im.size,im.getpixel((im.width//2,im.height//2)),flush=True)
              thumb=ImageOps.contain(im,(W-12,H-35))
              x=(n%4)*W+(W-thumb.width)//2
              y=(n//4)*H+4+(H-35-thumb.height)//2
              pic.paste(thumb,(x,y))
            except Exception as ex:print("ERROR",n,pid,type(ex).__name__,str(ex)[:200],flush=True)
            pen.text(((n%4)*W+8,(n//4)*H+H-26),f"{n+1}    {pid}",fill=(20,20,20))
          out=io.BytesIO()
          pic.save(out,format="JPEG",quality=64,optimize=True)
          b64=base64.b64encode(out.getvalue()).decode()
          print("CONTACT_BEGIN",len(b64),flush=True)
          for i in range(0,len(b64),4000):print("SHEET_CHUNK "+b64[i:i+4000],flush=True)
          print("CONTACT_END",flush=True)
          PY
