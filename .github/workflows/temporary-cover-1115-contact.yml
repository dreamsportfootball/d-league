name: Temporary 11-15 cover crop review
on:
  push:
    branches: [season/2026-27]
    paths: [.github/workflows/temporary-cover-1115-contact.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - run: python3 -m pip install pillow --quiet
      - name: Build 11-15 action-photo cover from Zonerama photo 692541082
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,io,base64
          from PIL import Image,ImageOps
          url="https://eu.zonerama.com/social/img/photo/692541082"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 Chrome/124 Safari/537.36"})
          with urllib.request.urlopen(req,timeout=25) as rsp:
            raw=rsp.read()
            assert rsp.status==200 and rsp.headers.get("Content-Type","").startswith("image/")
          source=Image.open(io.BytesIO(raw)).convert("RGB")
          assert source.width>=1200 and source.height>=1000,source.size
          cover=ImageOps.fit(source,(1200,800),method=Image.Resampling.LANCZOS,centering=(0.5,0.52))
          buf=io.BytesIO();cover.save(buf,"JPEG",quality=83,optimize=True,subsampling=0)
          binary=buf.getvalue()
          assert binary.startswith(b'\xff\xd8') and len(binary)>35000
          encoded=base64.b64encode(binary).decode("ascii")
          print("COVER_META",url,source.size,cover.size,len(binary),len(encoded),flush=True)
          print("COVER_BEGIN",flush=True)
          for i in range(0,len(encoded),4000):print("COVER_CHUNK "+encoded[i:i+4000],flush=True)
          print("COVER_END",flush=True)
          PY
